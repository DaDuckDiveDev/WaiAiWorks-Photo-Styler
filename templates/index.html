<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ghibli Photo Stylizer</title>
</head>
<body>
  <h1>Upload Photo to Stylize in Studio Ghibli Style</h1>

  <!-- Form for image upload -->
  <form id="uploadForm">
    <input type="file" name="image" id="imageInput" accept="image/*" required><br><br>
  </form>

  <!-- Status placeholder -->
  <p id="uploadStatus"></p>

  <script>
    document.getElementById("imageInput").addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append("image", file);

      document.getElementById("uploadStatus").textContent = "Uploading...";

      fetch("/upload", {
        method: "POST",
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.image_url) {
          document.getElementById("uploadStatus").textContent = "Upload successful!";
          console.log("Uploaded image URL:", data.image_url);
        } else {
          document.getElementById("uploadStatus").textContent = "Upload failed.";
        }
      })
      .catch(err => {
        document.getElementById("uploadStatus").textContent = "Error during upload.";
        console.error("Upload error:", err);
      });
    });
  </script>
</body>
</html>
