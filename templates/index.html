<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>AI Photo Stylizer</title>
  <style>
    :root {
      --sunset-darkpurple: #4b2354;
      --sunset-purple: #873e75;
      --sunset-coralorange: #ff6b3d;
      --sunset-orangeglow: #ff7a5c;
      --sunset-peach: #f7b267;
      --sunset-gold: #fbd786;
      --sunset-yellow: #ffeaa7;
      --sunset-sky: #a0d8ef;
      --sunset-blue: #7fc9f8;
      --ocean-deep: #1e3c72;
    }

    body {
      height: 100vh;
      margin: 0;
      background: linear-gradient(to bottom,
          var(--sunset-darkpurple) 0%,
          var(--sunset-purple) 8%,
          var(--sunset-coralorange) 16%,
          var(--sunset-orangeglow) 28%,
          var(--sunset-peach) 40%,
          var(--sunset-gold) 52%,
          var(--sunset-yellow) 64%,
          var(--sunset-sky) 76%,
          var(--sunset-blue) 88%,
          var(--ocean-deep) 100%);
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    h1 {
      text-align: center;
      color: var(--sunset-darkpurple);
    }

    #uploadStatus {
      margin-top: 20px;
      font-weight: bold;
      text-align: center;
    }

    #uploadPreview {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    #uploadPreview img {
      width: 300px;
      height: auto;
      margin: 5px;
      border: 2px solid white;
    }

    #outputGallery img {
      width: 300px;
      height: auto;
      margin: 10px;
      display: block;
    }

    #outputGallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    #outputGallery img:hover {
      transform: scale(1.2);
      transition: transform 0.2s ease;
      z-index: 2;
    }

    .output-item {
      text-align: center;
      margin-bottom: 30px;
    }

    .main {
      display: flex;
      gap: 40px;
      margin-top: 40px;
    }

    .upload-section,
    .results-section {
      flex: 1;
      padding: 0 10px;
    }

    input[type="file"] {
      display: none;
    }

    .custom-file-label {
      font-weight: bold;
      display: inline-block;
      padding: 12px 26px;
      font-size: 16px;
      color: white;
      background-color: rgba(64, 174, 215, 0.8);
      border: 2px solid white;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .custom-file-label:hover {
      background-color: rgba(44, 144, 185, 0.9);
    }

    .stylizeBtn {
      font-weight: bold;
      display: none;
      margin: 20px auto;
      padding: 12px 26px;
      font-size: 16px;
      color: white;
      background-color: rgba(64, 174, 215, 0.85);
      border: 2px solid white;
      border-radius: 6px;
      cursor: pointer;
    }

    .stylizeBtn.active {
      outline: 2px solid white;
      background-color: rgba(64, 174, 215, 0.95);
    }

    .stylizeBtn:hover {
      background-color: rgba(44, 144, 185, 0.9);
    }

    .loader {
      border: 6px solid rgba(255, 255, 255, 0.3);
      border-top: 6px solid white;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin: auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Support buttons */
    #supportButtons {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 100;
    }

    .support-btn {
      background-color: rgba(64, 174, 215, 0.85);
      border: 2px solid white;
      color: white;
      font-weight: bold;
      font-size: 14px;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .support-btn:hover {
      background-color: rgba(44, 144, 185, 0.95);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 200;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
    }

    .modal-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      border-radius: 8px;
    }

    .close-btn {
      color: #aaa;
      float: right;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    .close-btn:hover {
      color: black;
    }

    #supportForm input,
    #supportForm textarea {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    #supportForm button {
      margin-top: 12px;
      padding: 10px 16px;
      background-color: rgba(64, 174, 215, 0.85);
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    #supportForm button:hover {
      background-color: rgba(44, 144, 185, 0.95);
    }
  </style>
</head>

<body>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <img src="{{ url_for('static', filename='WaiaiLogoHori.png') }}" alt="Logo"
        style="height:80px; border-radius:8px;">
      <div style="color:white; font-weight:bold; font-size:28px;">
        Welcome,<br>{{ username }}
      </div>
    </div>
    <div id="creditsDisplay" style="color:white; font-weight:bold; font-size:20px;">
      Credits: {{ credits }}
    </div>
  </div>

  <h1>Upload Photo to Stylize</h1>

  <div class="main">
    <!-- Upload & Style -->
    <div class="upload-section">
      <div style="text-align:center;">
        <label for="imageInput" class="custom-file-label">⬆️ Choose Images</label>
        <input type="file" id="imageInput" name="image" accept="image/*" multiple>
      </div>
      <div id="styleButtons">
        <button class="stylizeBtn" data-style="anime">🎨 Anime</button>
        <button class="stylizeBtn" data-style="pixar">🧸 Pixar</button>
        <button class="stylizeBtn" data-style="comic">🦸 Comic</button>
        <button class="stylizeBtn" data-style="disney">👓 Disney</button>
      </div>
      <p id="uploadStatus"></p>
      <div id="spinner" style="display:none; text-align:center; margin-top:10px;">
        <div class="loader"></div>
      </div>
    </div>
    <div id="uploadPreview" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:15px;">
    </div>

    <!-- Results Gallery -->
    <div class="results-section">
      <h3>Results</h3>
      <div id="outputGallery"></div>
      <button id="downloadAllBtn" style="display:none; margin-top:20px;">Download All Stylized Images</button>
    </div>
  </div>

  <!-- Support Buttons & Modal -->
  <div id="supportButtons">
    <button onclick="openModal('report')" class="support-btn">🛠️ Report Issue</button>
    <button onclick="openModal('support')" class="support-btn">💬 Support</button>
  </div>
  <div id="supportModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle">Support</h2>
      <form id="supportForm">
        <label>Username:</label>
        <input type="text" name="username" value="{{ username }}" readonly><br><br>
        <label>Message:</label>
        <textarea name="message" rows="5" required></textarea>
        <button type="submit">Submit</button>
      </form>
    </div>
  </div>

  <script>
    let uploadedImageUrls = [];

    // 1) Upload & Preview Handler
    document.getElementById("imageInput").addEventListener("change", function () {
      const files = this.files;
      if (!files.length) return;
      if (files.length > 5) {
        alert("Please select up to 5 images only.");
        this.value = "";
        return;
      }

      // Reset UI
      uploadedImageUrls = [];
      document.getElementById("uploadPreview").innerHTML = "";
      document.getElementById("outputGallery").innerHTML = "";
      document.getElementById("downloadAllBtn").style.display = "none";
      document.getElementById("uploadStatus").textContent = "Uploading...";
      document.getElementById("spinner").style.display = "block";
      document.querySelectorAll(".stylizeBtn").forEach(btn => {
        btn.classList.remove("active");
        btn.disabled = false;
        btn.style.display = "none";
      });

      // Build formData
      const formData = new FormData();
      Array.from(files).forEach(f => formData.append("image", f));

      // POST /upload
      fetch("/upload", { method: "POST", body: formData })
        .then(r => r.json())
        .then(res => {
          document.getElementById("spinner").style.display = "none";
          const preview = document.getElementById("uploadPreview");
          preview.innerHTML = "";

          if (res.image_urls?.length) {
            uploadedImageUrls = res.image_urls;
            document.getElementById("uploadStatus").textContent = "Upload successful!";
            document.querySelectorAll(".stylizeBtn").forEach(btn => btn.style.display = "block");

            // Show thumbnails
            res.image_urls.forEach(url => {
              const img = document.createElement("img");
              img.src = url;
              preview.appendChild(img);
            });
          } else {
            document.getElementById("uploadStatus").textContent = "Upload failed.";
          }
        })
        .catch(err => {
          document.getElementById("spinner").style.display = "none";
          document.getElementById("uploadStatus").textContent = "Upload error.";
          console.error(err);
        });

      // Hook up Stylize buttons (inside change so they capture the new URLs)
      document.querySelectorAll(".stylizeBtn").forEach(btn => {
        btn.addEventListener("click", async function () {
          document.querySelectorAll(".stylizeBtn").forEach(b => b.classList.remove("active"));
          this.classList.add("active");
          const style = this.dataset.style;
          document.querySelectorAll(".stylizeBtn").forEach(b => b.disabled = true);

          if (!uploadedImageUrls.length) return;

          document.getElementById("uploadStatus").textContent = `Stylizing (${style})...`;
          const gallery = document.getElementById("outputGallery");
          gallery.innerHTML = "";

          try {
            const resp = await fetch("/stylize", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ image_urls: uploadedImageUrls, style })
            });
            const { stylized, remaining_credits } = await resp.json();

            stylized.forEach((it, i) => {
              const d = document.createElement("div");
              d.className = "output-item";
              const img = document.createElement("img");
              img.src = "/" + it.output_path;
              const a = document.createElement("a");
              a.href = `/track-download?path=${it.output_path}`;
              a.download = `stylized-${style}-${i + 1}.jpg`;
              a.innerText = "Download";
              d.append(img, a);
              gallery.append(d);
            });

            document.getElementById("creditsDisplay").textContent = `Credits: ${remaining_credits}`;
            document.getElementById("uploadStatus").textContent = "All done!";
            document.getElementById("downloadAllBtn").style.display = "block";
          } catch (e) {
            console.error(e);
            document.getElementById("uploadStatus").textContent = "Stylization failed.";
          }

          document.querySelectorAll(".stylizeBtn").forEach(b => b.disabled = false);
        });
      });

      // Download All button inside the change handler so it sees the freshly built gallery
      document.getElementById("downloadAllBtn").addEventListener("click", () => {
        document.querySelectorAll("#outputGallery a")
          .forEach((l, i) => setTimeout(() => l.click(), i * 600));
      });

    }); // ←←← closes the 'change' listener

    // 2) Modal & Support logic (outside of the change listener)
    function openModal(type) {
      document.getElementById("modalTitle").textContent =
        type === "report" ? "Report Issue" : "Support";
      document.getElementById("supportModal").style.display = "block";
    }
    function closeModal() {
      document.getElementById("supportModal").style.display = "none";
      document.getElementById("supportForm").reset();
    }
    document.getElementById("supportForm").addEventListener("submit", async e => {
      e.preventDefault();
      const u = e.target.username.value;
      const m = e.target.message.value;
      const t = document.getElementById("modalTitle").innerText.includes("Report")
        ? "Report" : "Support";
      try {
        const r = await fetch("/send-support", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u, message: m, topic: t })
        });
        const j = await r.json();
        alert(j.success ? "✅ Sent!" : "❌ Failed.");
        if (j.success) closeModal();
      } catch {
        alert("❌ Error sending.");
      }
    });
    window.addEventListener("click", e => {
      if (e.target.id === "supportModal") closeModal();
    });
  </script>
</body>
</html>
