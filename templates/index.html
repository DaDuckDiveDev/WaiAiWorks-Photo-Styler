<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ghibli Photo Stylizer</title>
  <style>
    body {
      background-color: #d3d3d3;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #333;
    }
    #uploadStatus {
      margin-top: 20px;
      font-weight: bold;
    }
    #stylizeBtn {
      display: none;
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
    }
    #outputImage {
      margin-top: 20px;
      max-width: 500px;
    }
    #downloadBtn {
      display: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Upload Photo to Stylize</h1>

  <form id="uploadForm">
    <input type="file" name="image" id="imageInput" accept="image/*" required><br><br>
  </form>

  <p id="uploadStatus"></p>

  <button id="stylizeBtn">Stylize Image</button>

  <div>
    <img id="outputImage" src="" alt="" />
    <br>
    <a id="downloadBtn" href="#" download="stylized.jpg">
      <button>Download Stylized Image</button>
    </a>
  </div>

  <script>
    let uploadedImageUrl = null;

    document.getElementById("imageInput").addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append("image", file);

      document.getElementById("uploadStatus").textContent = "Uploading...";
      document.getElementById("stylizeBtn").style.display = "none";
      document.getElementById("downloadBtn").style.display = "none";

      fetch("/upload", {
        method: "POST",
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.image_url) {
          uploadedImageUrl = data.image_url;
          document.getElementById("uploadStatus").textContent = "Upload successful!";
          document.getElementById("stylizeBtn").style.display = "inline-block";
        } else {
          document.getElementById("uploadStatus").textContent = "Upload failed.";
        }
      })
      .catch(err => {
        document.getElementById("uploadStatus").textContent = "Error during upload.";
        console.error("Upload error:", err);
      });
    });

    document.getElementById("stylizeBtn").addEventListener("click", function () {
      if (!uploadedImageUrl) return;

      document.getElementById("uploadStatus").textContent = "Stylizing...";

      fetch("/stylize", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image_url: uploadedImageUrl })
      })
      .then(res => res.blob())
      .then(blob => {
        const imageUrl = URL.createObjectURL(blob);
        document.getElementById("outputImage").src = imageUrl;
        document.getElementById("uploadStatus").textContent = "Stylization complete!";

        const downloadLink = document.getElementById("downloadBtn");
        downloadLink.href = imageUrl;
        downloadLink.style.display = "inline-block";
      })
      .catch(err => {
        document.getElementById("uploadStatus").textContent = "Stylization failed.";
        console.error("Stylization error:", err);
      });
    });
  </script>
</body>
</html>
