<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WaiAI Works Login</title>
  <style>
    :root {
      /* Palette tuned to your Figma */
      --lavender: #B98DFF;
      /* soft purple glow */
      --indigo: #6E64FF;
      /* deeper purple core */
      --peach: #FFB38A;
      /* warm peach mid */
      --coral: #FF7A86;
      /* pink/coral bottom-right */
      --blush: #FFD0D8;
      /* light pink wash */
      --gold: #E5C79A;
      /* muted warm gold bottom-left */
      --base-wash: #FDD1C2;
      /* overall warm base */
      --vignette: rgba(0, 0, 0, 0.04);
      --white-glow: rgba(255, 255, 255, 0.75);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background:
        /* subtle vignette */
        radial-gradient(120% 120% at 50% 50%, var(--vignette) 0%, transparent 70%),

        /* white highlight top-right */
        radial-gradient(60% 60% at 92% 8%, var(--white-glow) 0%, transparent 40%),

        /* coral blob bottom-right */
        radial-gradient(80% 80% at 88% 80%, var(--coral) 0%, transparent 60%),

        /* peach/orange mid-right */
        radial-gradient(85% 85% at 68% 42%, var(--peach) 0%, transparent 55%),

        /* warm gold bottom-left */
        radial-gradient(80% 80% at 12% 78%, rgba(229, 199, 154, 0.55) 0%, transparent 55%),

        /* lavender/indigo top-left */
        radial-gradient(85% 85% at 18% 18%, var(--indigo) 0%, var(--lavender) 35%, transparent 65%),

        /* soft overall pink wash */
        linear-gradient(120deg, var(--base-wash) 0%, var(--blush) 100%);

      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      padding: 40px;
    }

    .content-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      margin-bottom: 20px;
    }

    .logo img {
      width: 350px;
      max-width: 100%;
    }

    .login-container {
      background-color: rgba(255, 255, 255, 0.75);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      color: #fff1bc;
      text-align: center;
    }


    h2 {
      margin-bottom: 20px;
      color: #333;
      text-align: center;
    }

    form {
      width: 100%;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      display: block;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background-color: var(--sunset-blue);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #357ab7;
    }

    .error {
      color: red;
      margin-bottom: 10px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="content-wrapper">
    <div class="logo">
      <img src="{{ url_for('static', filename='WaiaiLogo.png') }}" alt="Logo">
    </div>
    <h1>It’s memory,<br>reimagined</h1>
    <div class="login-container">
      <h2>WaiAI Works – Restaurant Login</h2>

      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}

      <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
    </div>
  </div>
</body>

</html>
